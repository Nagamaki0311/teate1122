[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"

# SPA fallback for the editor app (/editor/callback etc). Static files under
# /editor/ (index.html, assets/*) are served directly by Netlify before this
# rule is considered, since `force` is not set.
[[redirects]]
  from = "/editor/*"
  to = "/editor/index.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/#profile"
  status = 301

[[redirects]]
  from = "/activities"
  to = "/#candles"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/#contact"
  status = 301

[[redirects]]
  from = "/candles"
  to = "/#candles"
  status = 301

[[redirects]]
  from = "/events"
  to = "/#events"
  status = 301

[[redirects]]
  from = "/gallery"
  to = "/#gallery"
  status = 301
