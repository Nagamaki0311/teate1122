[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/about"
  to = "/#profile"
  status = 301

[[redirects]]
  from = "/activities"
  to = "/#candles"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/#contact"
  status = 301

[[redirects]]
  from = "/candles"
  to = "/#candles"
  status = 301

[[redirects]]
  from = "/events"
  to = "/#events"
  status = 301

[[redirects]]
  from = "/gallery"
  to = "/#gallery"
  status = 301
