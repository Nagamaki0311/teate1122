<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="description" content="teate1122は、日々の暮らしに寄り添う手作りキャンドルをお届けしています。">
<link rel="icon" href="/favicon.svg">
<meta property="og:type" content="website">
<meta property="og:title" content="お問い合わせ | teate1122">
<meta property="og:description" content="teate1122は、日々の暮らしに寄り添う手作りキャンドルをお届けしています。">
<meta property="og:image" content="https://teate1122.netlify.app/assets/hero.svg">
<meta property="og:url" content="https://teate1122.netlify.app/contact">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;500&amp;family=Noto+Sans+JP:wght@400;500;700&amp;display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
  <div class="site-header__inner">
    <a class="site-header__brand" href="/">teate1122</a>
    <nav class="site-header__nav" aria-label="サイト内ナビゲーション">
      <a href="/about">プロフィール</a>
<a href="/activities">活動</a>
<a href="/contact" aria-current="page">お問い合わせ</a>
    </nav>
  </div>
</header>
<main>
<section class="section" data-type="text" data-section-id="s1" data-padding-y="xl" data-align="center" data-bg-type="token" data-bg-value="bg">
  <div class="section__inner">
    <div class="text-block">
    <h2>お問い合わせ</h2>
    <p class="text-block__body">準備中のダミーテキストです。ご質問やオーダーメイドのご相談など、お気軽にお問い合わせください。 お問い合わせフォーム（お名前・メールアドレス・お問い合わせ内容）よりご連絡ください。</p>
  </div>
  </div>
</section>
<section class="section" data-type="contact-social" data-section-id="s2" data-padding-y="lg" data-align="center" data-bg-type="token" data-bg-value="surface">
  <div class="section__inner">
    <div class="contact-social">
    <h2>SNS</h2>
    
    <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" class="contact-social__form">
      <input type="hidden" name="form-name" value="contact">
      <p class="contact-social__hp"><label>入力しないでください<input name="bot-field"></label></p>
      <div class="contact-social__field">
        <label for="contact-name">お名前</label>
        <input id="contact-name" name="name" type="text" required>
      </div>
      <div class="contact-social__field">
        <label for="contact-email">メールアドレス</label>
        <input id="contact-email" name="email" type="email" required>
      </div>
      <div class="contact-social__field">
        <label for="contact-message">お問い合わせ内容</label>
        <textarea id="contact-message" name="message" rows="6" required></textarea>
      </div>
      <button type="submit" class="btn">送信する</button>
    </form>
    
    <ul class="contact-social__list">
      <li><a href="https://www.instagram.com/teate1122" target="_blank" rel="noopener noreferrer">@teate1122</a></li>
    </ul>
  </div>
  </div>
</section>
</main>
<footer class="site-footer">
  <div class="site-footer__inner">
    <ul class="site-footer__social">
      <li><a href="https://www.instagram.com/teate1122" target="_blank" rel="noopener noreferrer">@teate1122</a></li>
    </ul>
    <p class="site-footer__copyright">&copy; 2026 teate1122. All rights reserved.</p>
  </div>
</footer>
</body>
</html>
